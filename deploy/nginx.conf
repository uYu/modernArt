server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Always fetch the current entry point after a deployment.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Vite gives JS/CSS and the AI worker content-hashed filenames.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Paintings keep their filenames when updated, so revalidate them.
    location /artworks/ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    location /api/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 2m;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
