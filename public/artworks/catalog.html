<!doctype html>
<html lang="zh-CN">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  /><title>现代艺术 · 作品目录</title
  ><style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 30px auto;
      max-width: 1050px;
      background: #f3f0e8;
      color: #29352d;
      font-family: system-ui;
      padding: 0 25px;
    }
    h1 {
      font: 32px serif;
    }
    p {
      font-size: 13px;
      color: #7b806f;
    }
    section {
      margin: 35px 0;
    }
    header {
      display: flex;
      gap: 20px;
      align-items: center;
      border-bottom: 3px solid;
      padding-bottom: 12px;
    }
    header h2 {
      font-size: 20px;
      margin: 0;
    }
    header span {
      font-size: 12px;
    }
    .works {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }
    figure {
      margin: 18px 0 0;
      background: #fbfaf6;
      padding: 10px;
    }
    img {
      width: 100%;
      aspect-ratio: 4/5;
      object-fit: cover;
      display: block;
    }
    figcaption {
      font-size: 12px;
      padding: 12px 0 2px;
    }
    @media (max-width: 500px) {
      body {
        padding: 0 14px;
      }
      .works {
        gap: 8px;
      }
      figure {
        padding: 4px;
      }
      figcaption {
        font-size: 9px;
      }
    }
  </style>
  <h1>现代艺术 · 作品目录</h1>
  <p>
    五位虚构艺术家，各三幅原创油画风格作品。使用 AI 生成，并非历史名画扫描件。
  </p>

</html>
